<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>杯赛裁判台</title>
<style>
:root{color-scheme:dark;--bg:#111412;--panel:#191e1b;--field:#121714;--line:#343e36;--text:#f2f1e6;--muted:#aab5aa;--gold:#edcb83;--green:#8ed3ab;--pink:#f4a998;--mono:"IBM Plex Mono",Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top right,#253028 0,transparent 58%),var(--bg);color:var(--text);font:14px/1.55 "Microsoft YaHei UI","PingFang SC",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;color:var(--text);background:#262f28;border:1px solid #47554a;border-radius:5px;padding:8px 12px;font-weight:600}
button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
button:disabled{opacity:.48;cursor:default}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input:not([type=checkbox]),select{width:100%;min-width:0;border:1px solid var(--line);border-radius:4px;background:var(--field);color:var(--text);padding:7px 9px}
.shell{max-width:1480px;margin:auto;padding:24px clamp(14px,3vw,44px) 44px}
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;padding:12px 0 19px;border-bottom:1px solid var(--line);margin-bottom:23px}
.mast h1{margin:0;font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:.035em;line-height:1.2}
.mast p{margin:7px 0 0;color:var(--muted)}
.cup{color:var(--gold);font-family:var(--mono);overflow-wrap:anywhere;text-align:right}
.mast-actions{display:grid;justify-items:end;gap:7px;min-width:0;max-width:45%}
.workspace{display:grid;grid-template-columns:minmax(290px,330px) minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.rules{padding:17px}.rules h2,.section h2{font-size:16px;margin:0}
.rule-actions{display:flex;gap:7px;margin:11px 0}
.rule-actions button{flex:1;padding:7px 5px;font-size:13px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 9px}
label.field{display:grid;gap:4px;color:var(--muted);font-size:12px}label.field[hidden]{display:none}
.span2{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:5px 13px;margin:9px 0 0;font-size:12px;color:var(--text)}
.checks label{display:flex;align-items:center;gap:4px}.checks label[hidden]{display:none}.checks input{accent-color:var(--gold)}
.rules details{margin:12px 0;border-top:1px solid var(--line);padding-top:8px}.rules summary{color:var(--muted);cursor:pointer;margin-bottom:8px}
.primary{background:var(--gold);color:#191710;border-color:var(--gold)}.primary:hover:not(:disabled){background:#ffdf9d;color:#191710}
.wide{width:100%;margin-top:12px}.hint{font-size:12px;color:var(--muted)}.rules .hint{margin:7px 0 0;overflow-wrap:anywhere}
.desk{display:grid;gap:14px}
.drop{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px;border-style:dashed;background:#1b2520}
.drop.drag{border-color:var(--gold);background:#2c3325}.drop strong{font-size:15px}.drop p{margin:2px 0 0}
.drop button{white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.filters button[aria-pressed=true]{color:var(--gold);border-color:#a18451;background:#332c1f}
.filters span[id]{font:12px var(--mono);margin-left:5px}
.section{overflow:hidden}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
.section-head input{max-width:228px}
.scroll{overflow:auto}
table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:#151a16}
td,th{padding:10px 12px;border-bottom:1px solid #2a342d}
td{vertical-align:middle}tbody tr:last-child td{border-bottom:0}
tbody tr:hover,tbody tr.selected{background:#222e25}
td.mono,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:12px;padding:1px 6px;border-radius:4px;background:#303c33;color:var(--text)}
.badge.ok{color:var(--green);background:#273e31}.badge.flag{color:var(--pink);background:#472d27}
.empty{padding:22px 14px;color:var(--muted);white-space:normal}
.code-button{background:none;color:var(--gold);border:0;padding:1px 0;font-family:var(--mono);text-decoration:underline;text-underline-offset:3px}
.filename{display:block;color:var(--muted);font-size:11px;max-width:230px;overflow:hidden;text-overflow:ellipsis}
.foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.detail{padding:14px 15px}.detail[hidden]{display:none}.detail h3{margin:0;font-size:16px}.detail p,.detail ul{margin:7px 0}.detail ul{padding-left:20px;color:var(--pink)}.detail .name{width:min(100%,230px)}
.detail-top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.detail table{font-size:12px}.detail summary{cursor:pointer;margin-top:13px}
.import-msg{min-height:19px;margin:0}.import-msg ul{margin:4px 0;padding-left:20px}
@media(max-width:850px){.workspace{grid-template-columns:minmax(0,1fr)}.rules .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rules .rule-actions{max-width:360px}}
@media(max-width:470px){.mast{align-items:flex-start}.drop,.section-head{align-items:stretch;flex-direction:column}.section-head input{max-width:none}}
</style>
</head>
<body>
<main class="shell">
  <header class="mast"><div><h1 data-en="Cup Referee Desk">杯赛裁判台</h1><p data-en="Verify results in batches and match recordings by run code.">批量核验成绩，按本局编号对照录像。</p></div><div class="mast-actions"><strong id="cup-label" class="cup">规则待确认</strong><button id="language-toggle" type="button" lang="en">English</button></div></header>
  <div class="workspace">
    <aside class="panel rules" aria-labelledby="rules-title">
      <h2 id="rules-title" data-en="Tournament Rules">当届规则</h2>
      <div class="rule-actions">
        <button id="read-rules" type="button" title="读取主办方 cup.json 或已确认的参考成绩" data-en-title="Load the organizer's cup.json or a verified reference result" data-en="Load Rules JSON">读取规则 JSON</button>
        <button id="save-rules" type="button" data-en="Save Rules JSON">保存规则 JSON</button>
        <input type="file" id="rules-file" accept=".json,application/json" hidden>
      </div>
      <form id="rules-form">
        <div id="main-fields" class="form-grid"></div>
        <details><summary data-en="Starting Conditions, Optional Rules &amp; Version">开局、娱乐规则与游戏版本</summary><div id="advanced-fields" class="form-grid"></div><div id="rule-checks" class="checks"></div></details>
        <button class="primary wide" type="submit" data-en="Apply Tournament Rules">应用当届规则</button>
      </form>
      <p class="hint" id="rule-message" role="status">也可以读取主办方的 cup.json，再确认应用。</p>
    </aside>
    <div class="desk">
      <section class="panel drop" id="drop-zone" aria-label="导入成绩" data-en-aria-label="Import results">
        <div><strong data-en="Import Player Results">导入选手成绩</strong><p class="hint" data-en="Drop or select multiple JSON files. Files are read locally.">可拖入多个 JSON，或一次选中多个文件。文件在本机读取。</p></div>
        <button class="primary" id="pick-files" data-en="Select Result Files">选择成绩 JSON</button><input id="result-files" type="file" accept=".json,application/json" multiple hidden>
      </section>
      <div id="import-message" class="hint import-msg" role="status" hidden></div>
      <nav class="filters" aria-label="筛选成绩" data-en-aria-label="Filter results">
        <button type="button" data-filter="all" aria-pressed="true"><span class="filter-label" data-en="All">全部</span><span id="count-all">0</span></button>
        <button type="button" data-filter="flag" aria-pressed="false"><span class="filter-label" data-en="Flagged">有疑点</span><span id="count-flag">0</span></button>
        <button type="button" data-filter="ok" aria-pressed="false"><span class="filter-label" data-en="Rankable">可排名</span><span id="count-ok">0</span></button>
      </nav>
      <section class="panel section">
        <div class="section-head"><h2 data-en="Results and Verification">成绩与核验</h2><input type="search" id="search" placeholder="查本局编号、选手或文件" data-en-placeholder="Search code, player, or file" aria-label="搜索成绩" data-en-aria-label="Search results"></div>
        <div class="scroll">
          <table><thead><tr><th data-en="Run Code">本局编号</th><th data-en="Player / File">选手 / 文件</th><th data-en="Verification">核验</th><th data-en="Score">成绩</th><th data-en="Retries / Deaths">SL / 死亡</th><th data-en="Penalty">罚时</th></tr></thead><tbody id="runs-body"></tbody></table>
        </div>
        <div class="foot"><span data-en="Select a run code to see flags and the event timeline.">点击本局编号查看疑点和事件时间轴。</span><button id="clear-runs" disabled data-en="Clear Results">清空导入</button></div>
      </section>
      <section id="run-detail" class="panel detail" aria-label="场次详情" data-en-aria-label="Run details" hidden></section>
      <section class="panel section">
        <div class="section-head"><h2 data-en="Provisional Rankings">暂定排名</h2><button id="export-ranking" disabled data-en="Export CSV">导出 CSV</button></div>
        <div class="scroll">
          <table><thead><tr><th data-en="Rank">名次</th><th data-en="Player">选手</th><th data-en="Run Code">本局编号</th><th data-en="Outcome">结果</th><th data-en="Best Time / Furthest Progress">最快用时 / 最远进度</th><th data-en="Penalty">罚时</th></tr></thead><tbody id="ranks-body"></tbody></table>
        </div>
        <div class="foot"><span data-en="Clears rank by time. Other runs rank by progress. Equal scores tie. Export the rankings before closing this page.">通关按用时，未通关按最远进度，同成绩并列。关闭页面前请导出排名。</span></div>
      </section>
    </div>
  </div>
</main>

const extendedDefaults = { FixedWeaponCombination:false, StolenWeaponDamageMultiplier:2,

const multiplierFields = ["StolenWeaponDamageMultiplier","EnemyHealthMultiplier","EnemyAttackMultiplier"];
const defaults = { EventId:"Cup-001", RouteId:"hero", BossId:"", FastStory:true, Seed:20261113, BattleMode:"probability",

const own = (obj, key) => Object.hasOwn(obj, key);
const legacyTraining = version => /^0\.4\.[0-8]$/.test(version || "");

function defaultsForVersion(version) {
  if (!legacyStealRules(version)) return defaults;
  const {ExtraActionAfterSteal, ...legacy} = defaults;
  return {...legacy, StolenWeaponVulnerability:false};
}
function normalizeSettings(settings, version) {
  if (object(settings) && !version) {
    const {StolenWeaponVulnerability, ...config} = settings;
    settings = {...extendedDefaults, ExtraActionAfterSteal:false, ...config};
  }
  if (object(settings) && /^0\.4\./.test(version || ""))
    settings = {...extendedDefaults, StolenWeaponVulnerability:false, ...settings};
  if (object(settings) && !own(settings,"FastStory") && (!version || /^0\.(4\.\d+|5\.[01])$/.test(version)))

    return {...settings, HarshTraining:false};

  key === "RouteId" && !!left.BossId && left.BossId === right.BossId;

  key === "BattleMode" ? named({timing:t("时机", "Timing"),probability:t("概率", "Probability")},value) || value : String(value);

function settingsProblems(settings, version) {
  if (!object(settings)) return [t("缺少有效的 Settings", "Missing or invalid Settings")];

function rankRuns(entries) {
  const key = ({run}) => run.Status === "clear" ? [0,run.ElapsedMilliseconds] : [1,-run.Progress];

      const run=JSON.parse(await file.text());
      if (!object(run) || (!own(run,"RunId") && !own(run,"Status")))
        return {filename:file.name, error:()=>t("文件不像一局成绩", "The file does not look like a result")};
      return {run, filename:file.name, name:"", key:payloadKey(run)};
    } catch(error) {
      return {filename:file.name, error:()=>error instanceof SyntaxError ? t("JSON 格式无效", "Invalid JSON") : t("无法读取文件", "Could not read file")};
    }
  }));
  let loaded=0, duplicates=0;
  const errors=[];
  for (const entry of read) {
    if (entry.error) { errors.push(entry); continue; }
    if (files.some(file=>file.key===entry.key)) { duplicates++; continue; }
    files.push(entry); loaded++;
  }
  lastImport = {loaded,duplicates,errors};
  render();
}
function renderImportMessage() {
  const message = $("import-message");
  message.hidden = !lastImport;
  if (!lastImport) return;
  const {loaded,duplicates,errors} = lastImport;
  message.replaceChildren(node("span",t(`已导入 ${loaded} 个 · 跳过相同文件 ${duplicates} 个 · 读取失败 ${errors.length} 个`, `Imported ${loaded} · Skipped ${duplicates} duplicates · Failed ${errors.length}`)));
  if (errors.length) {
    const list = node("ul");
    for (const entry of errors) list.append(node("li",entry.filename+" · "+entry.error()));
    message.append(list);
  }
}
$("pick-files").onclick=()=>$("result-files").click();
$("result-files").onchange=event=>{ importFiles(event.target.files); event.target.value=""; };
const drop=$("drop-zone");
drop.ondragover=event=>{ event.preventDefault(); drop.classList.add("drag"); };
drop.ondragleave=()=>drop.classList.remove("drag");
drop.ondrop=event=>{ event.preventDefault(); drop.classList.remove("drag"); importFiles(event.dataTransfer.files); };
window.addEventListener("dragover",event=>event.preventDefault());
window.addEventListener("drop",event=>event.preventDefault());
$("search").oninput=render;
$("clear-runs").onclick=()=>{
  if (!window.confirm(t("清空本页已导入的成绩及填写的选手名？", "Clear the imported results and player names?"))) return;
  files=[]; selected=null;
  lastImport=null;
  render();
};
for (const button of document.querySelectorAll("[data-filter]")) button.onclick=()=>{
  filter=button.dataset.filter;
  for (const other of document.querySelectorAll("[data-filter]")) other.setAttribute("aria-pressed",String(button===other));
  render();
};

function emptyRow(body,text,columns) {
  const tr=node("tr"), td=node("td",text,"empty"); td.colSpan=columns; tr.append(td); body.append(tr);
}
function cell(row,text,cls) { const td=node("td",text,cls); row.append(td); return td; }
function identity(entry) { return typeof entry.run.RunCode==="string" ? entry.run.RunCode : t("编号缺失", "Missing Run Code"); }
function toName(entry) { return entry.name || entry.filename.replace(/\.json$/i,""); }
const progressNames = [
  ["序章","Prologue"], ["开局分配","Opening Allocation"], ["选择同伴","Choose a Companion"], ["献祭仪式","Sacrifice Ritual"],
  ["终战 · 第一场决斗胜利","Final Battle · First Duel Won"], ["终战 · 第二场决斗胜利","Final Battle · Second Duel Won"],
  ["僧侣终战胜利","Priest Final Battle Won"], ["魔王终战胜利","Demon King Final Battle Won"],
  ["勇者终击成功","Hero's Finishing Blow Landed"], ["魔法师终战胜利","Mage Final Battle Won"],
  ["已进入目标 Boss 战","Target Boss Battle Entered"]
];
const progressPatterns = [
  [/^第 (\d+) 层 · 第 (\d+) 区$|^Floor (\d+) · Section (\d+)$/, (f,s)=>t(`第 ${f} 层 · 第 ${s} 区`, `Floor ${f} · Section ${s}`)],
  [/^第 (\d+) 层$|^Floor (\d+)$/, f=>t(`第 ${f} 层`, `Floor ${f}`)],
  [/^已击败第 (\d+) 层首领$|^Floor (\d+) Boss Defeated$/, f=>t(`已击败第 ${f} 层首领`, `Floor ${f} Boss Defeated`)],
  [/^终战 · 完成第 (\d+) 阶段$|^Final Battle · Phase (\d+) Complete$/, p=>t(`终战 · 完成第 ${p} 阶段`, `Final Battle · Phase ${p} Complete`)],
  [/^目标 Boss · 完成第 (\d+) 阶段$|^Target Boss · Phase (\d+) Complete$/, p=>t(`目标 Boss · 完成第 ${p} 阶段`, `Target Boss · Phase ${p} Complete`)]
];
function localizedProgress(text) {
  const name = progressNames.find(([zh,en])=>text===zh || text===en);
  if (name) return t(...name);
  for (const [pattern, format] of progressPatterns) {
    const match = pattern.exec(text);
    if (match) return format(...match.slice(1).filter(value=>value!==undefined));
  }
  return text;
}
function progress(run) { return typeof run.ProgressName==="string" ? localizedProgress(run.ProgressName) : "—"; }
function resultName(run) { return named(statusNames[language],run.Status) || t("未知", "Unknown"); }
function penalty(ms) { return integer(ms) ? "+"+Number(ms/1000)+t(" 秒", " s") : "—"; }
function shortTime(run) { return run.Status==="clear" ? clock(run.ElapsedMilliseconds) : progress(run); }
function candidate(entry) { return !!rules && !entry.issues.length; }
function inspectFiles() {
  const byId=new Map(), byCode=new Map();
  const count = (map,key)=>{ if (typeof key==="string" && key) map.set(key,(map.get(key)||0)+1); };
  for (const {run} of files) { count(byId,run.RunId); count(byCode,run.RunCode); }
  for (const entry of files) {
    entry.issues=auditRun(entry.run,rules);
    if (byId.get(entry.run.RunId)>1) entry.issues.push(t("同一个完整 RunId 出现多份内容不同的成绩", "The same full RunId has conflicting results"));
    if (byCode.get(entry.run.RunCode)>1 && byId.get(entry.run.RunId)===1)
      entry.issues.push(t("八位本局编号与另一场次重复，请用完整 RunId 对照", "Two runs share an eight-character run code. Use the full RunId to distinguish them"));
  }
}
function render() {
  renderImportMessage();
  inspectFiles();
  const flagged=files.filter(e=>e.issues.length).length;
  $("count-all").textContent=files.length;
  $("count-flag").textContent=flagged;
  $("count-ok").textContent=files.filter(candidate).length;
  $("clear-runs").disabled=!files.length;
  rankings=rankRuns(files.filter(candidate));
  const tbody=$("runs-body"); tbody.replaceChildren();
  const query=$("search").value.trim().toLowerCase();
  const visible=files.filter(e=>(filter==="all" || (filter==="flag" ? e.issues.length : candidate(e))) &&
    [e.filename,e.name,e.run.RunId,e.run.RunCode].some(value=>typeof value==="string" && value.toLowerCase().includes(query)));
  if (!visible.length) emptyRow(tbody,files.length ? t("这个筛选下没有场次。", "No runs match the current filter.") : t("导入选手导出的成绩 JSON 后，场次会出现在这里。", "Import exported player results to see them here."),6);
  for (const entry of visible) {
    const run=entry.run, row=node("tr");
    if (selected===entry) row.classList.add("selected");
    const code=node("button",identity(entry),"code-button"); code.title=typeof run.RunId==="string"?run.RunId:"";
    code.onclick=()=>{ selected=entry; render(); $("run-detail").scrollIntoView({block:"nearest"}); };
    cell(row).append(code);
    const name=cell(row,entry.name || "—"); const file=node("span",entry.filename,"filename"); file.title=entry.filename; name.append(file);
    cell(row).append(node("span",entry.issues.length ? t(`有疑点 ${entry.issues.length}`, `Flagged (${entry.issues.length})`) : rules ? t("核验通过", "Verified") : t("待应用规则", "Awaiting Rules"),
      "badge "+(entry.issues.length?"flag":rules?"ok":"")));
    const score=cell(row,shortTime(run),run.Status==="clear"?"mono":undefined);
    score.append(node("span",resultName(run),"filename"));
    cell(row,`${integer(run.RoomRetriesUsed)?run.RoomRetriesUsed:"—"} / ${integer(run.Deaths)?run.Deaths:"—"}`,"mono");
    cell(row,penalty(run.PenaltyTotalMilliseconds)); tbody.append(row);
  }
  const ranks=$("ranks-body"); ranks.replaceChildren();
  if (!rankings.length) emptyRow(ranks,rules ? t("已导入的场次中暂无可排名成绩。", "No imported results are eligible for ranking.") : t("应用当届规则后生成排名。", "Apply the tournament rules to generate rankings."),6);
  for (const {entry,rank} of rankings) {
    const run=entry.run,row=node("tr");
    cell(row,String(rank),"mono"); cell(row,toName(entry)); cell(row,identity(entry),"mono");
    cell(row,resultName(run)); cell(row,shortTime(run)); cell(row,penalty(run.PenaltyTotalMilliseconds)); ranks.append(row);
  }
  $("export-ranking").disabled=!rankings.length;
  renderDetail();
}

function renderDetail() {
  const panel=$("run-detail"); panel.hidden=!selected; panel.replaceChildren();
  if (!selected) return;
  const entry=selected, run=entry.run;
  const title=node("div",undefined,"detail-top");
  title.append(node("h3",t("本局 ", "Run ")+identity(entry)),node("span",entry.filename,"hint"));
  const label=node("label",undefined,"field name"), name=node("input");
  name.value=entry.name; name.placeholder=t("填写比赛名单上的名字", "Name on tournament roster");
  name.onchange=()=>{ entry.name=name.value.trim(); render(); };
  label.append(node("span",t("选手名", "Player Name")),name);
  const remove=node("button",t("移除此成绩", "Remove Result"));
  remove.onclick=()=>{ files=files.filter(file=>file!==entry); selected=null; render(); };
  title.append(label,remove); panel.append(title);
  const s=run.Settings;
  const detail = object(s) ? t(`${showValue(s.BossId?"BossId":"RouteId",goal(s))} · 种子 ${showValue("Seed",s.Seed)} · 起始第 ${showValue("StartingFloor",s.StartingFloor)} 层`, `${showValue(s.BossId?"BossId":"RouteId",goal(s))} · Seed ${showValue("Seed",s.Seed)} · Starting Floor ${showValue("StartingFloor",s.StartingFloor)}`) : t("配置无效", "Invalid settings");
  panel.append(node("p",detail,"hint"));
  if (entry.issues.length) {
    const list=node("ul"); for(const issue of entry.issues) list.append(node("li",issue)); panel.append(list);
  } else panel.append(node("p",rules?t("自动核验通过，等待录像复核。", "Automatic verification passed. Review the recording."):t("文件检查通过，等待应用当届规则。", "The file passed its initial checks. Apply the tournament rules to verify it."),"hint"));
  if (!Array.isArray(run.Events)) return;
  const disclosure=node("details"); disclosure.open=true; disclosure.append(node("summary",t("事件时间轴", "Event Timeline")));
  const scroll=node("div",undefined,"scroll"), table=node("table"), header=node("thead"), hr=node("tr"), body=node("tbody");
  for(const text of [t("事件", "Event"),t("开局后实际时间", "Wall Time"),t("比赛用时", "Run Time"),t("本次罚时", "Added Penalty"),t("累计罚时", "Total Penalty"),t("SL / 死亡", "Retries / Deaths")]) hr.append(node("th",text));
  header.append(hr);
  for(const e of run.Events) {
    if (!object(e)) continue;
    const row=node("tr");
    const state=named({within_limit:t("额度内", "Within Limit"),over_limit:t("超限", "Over Limit"),exempt:t("免罚", "Exempt")},e.Result) || named(statusNames[language],e.Result);
    let eventDetail = typeof e.Detail==="string" ? e.Detail : "";
    if (e.Kind==="finish" && e.Result==="clear") {
      eventDetail = named(goalNames[language].bosses,eventDetail) || named(goalNames[language].routes,eventDetail) || eventDetail;
    } else if (["checkpoint","timer_start","finish"].includes(e.Kind)) {
      eventDetail = localizedProgress(eventDetail);
    }
    cell(row,[named(eventsNames[language],e.Kind)||t("未知事件", "Unknown Event"),state,eventDetail].filter(Boolean).join(" · "));
    cell(row,clock(e.WallMilliseconds),"mono"); cell(row,clock(e.ElapsedMilliseconds),"mono");
    cell(row,penalty(e.PenaltyAddedMilliseconds)); cell(row,penalty(e.PenaltyTotalMilliseconds));
    cell(row,`${integer(e.RoomRetriesUsed)?e.RoomRetriesUsed:"—"} / ${integer(e.Deaths)?e.Deaths:"—"}`,"mono"); body.append(row);
  }
  table.append(header,body);scroll.append(table);disclosure.append(scroll);panel.append(disclosure);
}

$("export-ranking").onclick=()=>{
  if (!rankings.length) return;
  const rows=[[t("杯赛编号", "Cup ID"),t("名次", "Rank"),t("选手", "Player"),t("本局编号", "Run Code"),t("完整 RunId", "Full RunId"),t("结果", "Outcome"),t("用时", "Elapsed Time"),t("最远进度", "Furthest Progress"),t("SL 次数", "Room Retries"),t("正式死亡", "Deaths"),t("累计罚时（秒）", "Total Penalty (s)"),t("源文件", "Source File")]];
  for(const {entry,rank} of rankings) {
    const run=entry.run;
    rows.push([rules.Settings.EventId,rank,toName(entry),run.RunCode,run.RunId,resultName(run),
      clock(run.ElapsedMilliseconds),progress(run),run.RoomRetriesUsed,run.Deaths,run.PenaltyTotalMilliseconds/1000,entry.filename]);
  }
  download(fileKey(rules.Settings.EventId)+t("-暂定排名.csv", "-provisional-rankings.csv"),toCsv(rows),"text/csv;charset=utf-8");
};
const staticCopy = [...document.querySelectorAll("[data-en]")].map(el=>[el,el.textContent,el.dataset.en]);
const translatedAttributes = ["title","placeholder","aria-label"].flatMap(attribute=>
  [...document.querySelectorAll(`[data-en-${attribute}]`)].map(el=>
    [el,attribute,el.getAttribute(attribute),el.getAttribute(`data-en-${attribute}`)]));
const toggle = $("language-toggle");
const localeKey = "annihilated-cup-referee-language";
function setLanguage(next) {
  language = next;
  document.documentElement.lang = t("zh-CN","en");
  document.title = t("杯赛裁判台","Cup Referee Desk");
  for (const [el,zh,en] of staticCopy) el.textContent = t(zh,en);
  for (const [el,attr,zh,en] of translatedAttributes) el.setAttribute(attr,t(zh,en));
  toggle.textContent = t("English","简体中文");
  toggle.lang = t("en","zh-CN");
  for (const [key,el] of Object.entries(fieldLabels)) el.textContent = fieldLabel(key);
  for (const [key,options] of [["Mode",modes()],["BattleMode",battleModes()],["RouteId",storyRoutes()],["DisabledCharacter",characterOptions()],
    ["Goal",Object.entries(goalNames[language][fields.Mode.value])]]) {
    const value = fields[key].value;
    setOptions(fields[key],options);
    fields[key].value = value;
  }
  $("cup-label").textContent = rules ? rules.Settings.EventId : t("规则待确认","Rules Pending");
  $("rule-message").textContent = ruleMessage();
  render();
}
let preferredLanguage;
try { preferredLanguage = localStorage.getItem(localeKey); } catch { /* Some browsers restrict storage for local files. */ }
toggle.onclick=()=>{
  setLanguage(t("en","zh"));
  try { localStorage.setItem(localeKey,language); } catch { /* Switching also works for this session. */ }
};
setLanguage(preferredLanguage==="zh" || preferredLanguage==="en" ? preferredLanguage :
  /^zh(?:-|_|$)/i.test(navigator.language) ? "zh" : "en");
</script>
